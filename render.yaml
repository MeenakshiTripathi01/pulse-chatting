# Render Blueprint: one web service that serves the API, Socket.IO and the built React app.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: pulse-chat
    runtime: node
    plan: free
    # devDependencies (Vite, Tailwind) are needed to build the client, so include them even
    # though NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: SERVE_CLIENT
        value: 'true'
      - key: TRUST_PROXY
        value: '1'
      - key: COOKIE_SAME_SITE
        value: lax
      # Skip downloading the test-only in-memory MongoDB binary during deploys.
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: '1'
      - key: JWT_SECRET
        generateValue: true
      # Secret: entered in the Render dashboard during setup, never committed.
      - key: MONGODB_URI
        sync: false
      # CLIENT_ORIGIN is optional on Render: the server automatically allows the service's
      # public URL (RENDER_EXTERNAL_URL). Add CLIENT_ORIGIN only for a custom domain.
